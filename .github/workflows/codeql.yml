name: 🛡️ CodeQL 安全扫描

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - '**.ts'
      - '**.js'
  schedule:
    - cron: '37 2 * * 0'  # 每周日

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python,javascript
      - uses: github/codeql-action/analyze@v3

# 景一知识管线 · 每日自动运行
name: 🤖 自动知识管线

on:
  schedule:
    - cron: '57 0 * * *'    # 每天 8:57 北京时间
  workflow_dispatch:          # 手动触发

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install -e .

      - name: 运行全管线（抓取→分类→去重→质量→改写→输出）
        run: python3 -m src.main --dry-run
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}

      - name: 运行本地管线（扫描→下载→冶炼）
        run: python3 auto_pipeline.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 结果
        run: echo "✅ 管线完成 — 查看 fable-cc.github.io/fable-castle"
